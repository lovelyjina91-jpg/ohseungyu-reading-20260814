<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>오승유 기본 실력 확인 · 독해 개념 20문항 | 영핏 지나티처</title>
<style>
  :root { --teal:#2f7c83; --teal-d:#235e64; --teal-l:#e6f1f1; --line:#dbe4e5; --ink:#243137; --ink2:#52646d; --shadow:0 6px 24px rgba(36,49,55,.08); }
  .brand-head { text-align:center; margin-bottom:16px; }
  .brand-head .logo { display:inline-flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.5px; color:var(--teal-d); font-size:18px; }
  .brand-head .logo .mk { width:30px; height:30px; border-radius:9px; background:var(--teal); color:#fff; display:grid; place-items:center; font-size:15px; font-weight:800; box-shadow:var(--shadow); }
  .brand-head .bsub { color:var(--ink2); font-size:13px; margin-top:4px; }
  .brand { text-align:center; margin-top:18px; }
  .brand .logo { display:inline-flex; align-items:center; gap:7px; font-weight:800; color:var(--teal-d); font-size:14px; }
  .brand .logo .mk { width:23px; height:23px; border-radius:7px; background:var(--teal); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; background:linear-gradient(160deg,#eef2f3,#e2ebec); color:#243137; min-height:100vh; display:flex; justify-content:center; padding:18px 12px 60px; }
  .wrap { width:100%; max-width:620px; }
  .card { background:#fff; border-radius:16px; padding:24px 20px; border:1px solid #dbe4e5; box-shadow:0 6px 24px rgba(36,49,55,.08); margin-bottom:14px; }
  h1 { font-size:1.28rem; color:#235e64; margin-bottom:6px; letter-spacing:-.3px; }
  h2 { font-size:1.05rem; color:#235e64; margin-bottom:10px; }
  .sub { font-size:.88rem; color:#52646d; line-height:1.6; margin-bottom:16px; }
  .brand { font-size:.78rem; color:#52646d; text-align:center; margin-top:6px; }
  input[type=text] { width:100%; padding:13px; font-size:1.05rem; border:1.5px solid #dbe4e5; border-radius:10px; }
  input[type=text]:focus { outline:none; border-color:#2f7c83; }
  .btn { display:block; width:100%; margin-top:14px; padding:14px; font-size:1.05rem; font-weight:700; color:#fff; background:#2f7c83; border:none; border-radius:10px; cursor:pointer; }
  .btn:disabled { background:#b6c4c6; cursor:default; }
  .btn.ghost { background:#fff; color:#2f7c83; border:1.5px solid #2f7c83; }
  .progress { font-size:.82rem; color:#52646d; margin-bottom:8px; display:flex; justify-content:space-between; }
  .bar { height:6px; background:#dbe4e5; border-radius:99px; overflow:hidden; margin-bottom:16px; }
  .bar > i { display:block; height:100%; background:#2f7c83; width:0; transition:width .25s; }
  .passage { background:#f7faf9; border:1.5px solid #dbe4e5; border-radius:12px; padding:14px 15px; margin-bottom:16px; }
  .passage .ptag { display:inline-block; font-size:.72rem; font-weight:700; color:#fff; background:#2f7c83; border-radius:99px; padding:3px 10px; margin-bottom:8px; }
  .passage p { font-size:.97rem; line-height:1.85; letter-spacing:.1px; }
  .passage .gloss { display:block; margin-top:8px; font-size:.78rem; color:#52646d; }
  .qtext { font-size:1.05rem; line-height:1.65; margin-bottom:14px; font-weight:700; }
  .choice { display:block; width:100%; text-align:left; padding:13px 14px; margin-bottom:9px; font-size:1rem; line-height:1.5; background:#f6f9f8; border:1.5px solid #dbe4e5; border-radius:10px; cursor:pointer; }
  .choice:active { background:#e6f1f1; }
  .choice.picked { background:#e6f1f1; border-color:#2f7c83; }
  .num { color:#2f7c83; font-weight:700; margin-right:6px; }
  .concept { border:1.5px solid #dbe4e5; border-radius:12px; padding:15px 16px; margin-bottom:12px; background:#fbfdfc; }
  .concept .ctitle { font-size:1rem; font-weight:700; color:#2f7c83; margin-bottom:8px; }
  .concept p { font-size:.93rem; line-height:1.7; margin-bottom:6px; }
  .ex { background:#e6f1f1; border-radius:8px; padding:9px 11px; font-size:.9rem; line-height:1.65; margin-top:7px; }
  .ex em { font-style:normal; color:#2f7c83; font-weight:700; }
  details { margin-bottom:14px; }
  details > summary { cursor:pointer; font-size:.88rem; color:#2f7c83; font-weight:700; padding:9px 12px; background:#e6f1f1; border-radius:9px; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  details[open] > summary { margin-bottom:10px; }
  .score-big { font-size:2.1rem; font-weight:700; color:#235e64; text-align:center; margin:10px 0 4px; }
  .exp { background:#f6f9f8; border-left:4px solid #2f7c83; border-radius:8px; padding:12px 14px; margin-bottom:10px; font-size:.92rem; line-height:1.65; }
  .exp.wrong { border-left-color:#c2603f; background:#fbeae3; }
  .exp b { color:#235e64; }
  .exp.wrong b { color:#c2603f; }
  .exp .key { color:#235e64; font-weight:700; }
  .hidden { display:none; }
  .tip { font-size:.83rem; color:#52646d; text-align:center; margin-top:10px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-head">
    <div class="logo"><span class="mk">영</span> 영핏 지나티처</div>
    <div class="bsub" id="brand-sub">기본 실력 확인 · 1영역 · 신발에 얽힌 미신</div>
  </div>


  <!-- 이어하기 -->
  <div class="card hidden" id="resume-card">
    <h1>이어서 풀까요? 🔖</h1>
    <p class="sub" id="resume-sub"></p>
    <button class="btn" id="resume-btn">이어서 하기</button>
    <button class="btn ghost" id="restart-btn">처음부터 다시 풀기</button>
    <div class="brand"><span class="logo"><span class="mk">영</span> 영핏 지나티처</span></div>
  </div>

  <!-- 시작 -->
  <div class="card" id="start-card">
    <h1 id="start-title">기본 실력 확인 📗</h1>
    <p class="sub" id="start-sub"></p>
    <input type="text" id="name-input" placeholder="이름을 입력하세요" maxlength="20" autocomplete="off">
    <button class="btn" id="start-btn" disabled>개념 카드 보러 가기</button>
    <div class="brand"><span class="logo"><span class="mk">영</span> 영핏 지나티처</span></div>
  </div>

  <!-- 개념 카드 -->
  <div class="card hidden" id="concept-card">
    <h1>개념 카드 8장 🃏</h1>
    <p class="sub">이 8가지만 알면 오늘 20문항은 다 풀려요. 천천히 읽어보고 시작하기!</p>
    <div id="concept-box"></div>
    <button class="btn" id="to-quiz-btn">문제 풀러 가기</button>
  </div>

  <!-- 문제 -->
  <div class="card hidden" id="quiz-card">
    <div class="progress"><span id="progress"></span><span id="ptitle"></span></div>
    <div class="bar"><i id="bar-i"></i></div>
    <div id="passage-box"></div>
    <details id="concept-toggle"><summary>📖 개념 카드 다시 보기</summary><div id="concept-box2"></div></details>
    <div class="qtext" id="qtext"></div>
    <div id="choices"></div>
    <p class="tip">숫자키 1~5 로도 고를 수 있어요</p>
  </div>

  <!-- 결과 -->
  <div class="card hidden" id="result-card">
    <h1>수고했어요! 🎉</h1>
    <div class="score-big" id="score-line"></div>
    <p class="sub" style="text-align:center" id="cheer"></p>
    <div id="submit-status" class="hidden"></div>
    <button class="btn" id="kakao-btn">결과 복사하기 → 지나티처에게 카톡으로 보내기</button>
    <p class="tip">버튼을 누르면 결과가 복사돼요. 카톡 대화창에 붙여넣어 보내주세요!</p>
    <a class="btn ghost hidden" id="next-link" href="#" style="text-decoration:none;text-align:center">다음 영역 풀러 가기 →</a>
    <div style="margin-top:22px">
      <h2>📝 전체 해설</h2>
      <div id="explanations"></div>
    </div>
    <div class="brand"><span class="logo"><span class="mk">영</span> 영핏 지나티처</span></div>
  </div>

</div>

<script>
"use strict";

/* ══════ 결과 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}
var _engfitSent = false;
async function engfitSubmitQuiet(r) {
  if (_engfitSent) return; _engfitSent = true;
  try { await engfitSubmit(r); } catch (e) {}
}

/* ══════ 지문 ══════ */
var PASSAGES = {
  A: { tag: "지문 A · Superstitions about Shoes",
    text: "There are many superstitions about shoes. If you give a pair of shoes to your girlfriend, she will walk away from you! If you put your shoes on the wrong feet, you will have an accident. Also, it is dangerous to put your shoes on the table. You might get into a fight with someone. It is also bad luck to put on your left shoe first. However, if you want good luck, tie someone's shoelaces and make a wish.",
    gloss: "*superstition 미신 / shoelace 신발 끈" },
  B: { tag: "지문 B · Protect Your Computer",
    text: "Nowadays, it is very important that you protect your computer and personal information. There are many harmful things on the Internet. You should be careful when you download a program. Viruses, worms, and spyware can come into your computer. These programs can harm your computer. Also, they can steal your personal information. For example, spyware records and sends your IDs, passwords, and other personal information to the person who made it.",
    gloss: "*virus 바이러스 / worm 웜 / spyware 스파이웨어" },
  C: { tag: "지문 C · Clocky",
    text: "Is it hard for you to wake up in the morning? Do you hit the snooze button on your alarm clock and fall asleep again? Well, there's good news for you! There is a new alarm clock. You have to get up to turn it off. Its name is Clocky. It has wheels and sits on the floor or table. When you push the snooze button, the clock moves around the room and hides. It continues to ring loudly. You must get up, find the clock, and turn it off. If you have Clocky in your bedroom, there can be no more sleeping late!",
    gloss: "*snooze button (알람의) 절전 버튼" }
};

/* ══════ 개념 카드 ══════ */
var CONCEPTS = [
  { t: "1. 가주어 it — 진짜 주어는 뒤에 있다",
    d: "주어 자리에 to부정사(또는 that절)가 오면 너무 길어져서, 자리만 채우는 <b>가주어 it</b>을 앞에 두고 진짜 주어는 뒤로 보내요. 이때 it은 <b>'그것'이라고 해석하지 않습니다.</b>",
    e: "<em>It</em> is dangerous <em>to put your shoes on the table.</em><br>→ 신발을 탁자 위에 올려놓는 것은 위험하다.<br><em>It</em> is very important <em>that you protect your computer.</em>" },
  { t: "2. 의미상 주어 for + 목적격",
    d: "to부정사의 '행동을 하는 사람'을 따로 밝힐 때 to 앞에 <b>for + 목적격</b>을 씁니다. 해석은 '<b>~가 …하는 것</b>'.",
    e: "Is it hard <em>for you</em> <em>to wake up</em> in the morning?<br>→ <b>네가</b> 아침에 일어나는 것이 힘드니?" },
  { t: "3. There is / There are — '~가 있다'",
    d: "There는 해석하지 않고, <b>뒤에 오는 명사가 진짜 주어</b>예요. 그 명사가 단수면 There <b>is</b>, 복수면 There <b>are</b>.",
    e: "<em>There are</em> many superstitions about shoes. (복수 → are)<br><em>There is</em> a new alarm clock. (단수 → is)" },
  { t: "4. 조동사 should / have to / must",
    d: "should는 '<b>~하는 게 좋겠다</b>'(충고), have to·must는 '<b>~해야 한다</b>'(필요·의무). 조동사 뒤에는 <b>항상 동사원형</b>이 옵니다.",
    e: "You <em>should be</em> careful. (조심하는 게 좋겠어)<br>You <em>have to get</em> up. / You <em>must get</em> up. (일어나야 해)" },
  { t: "5. 「동사 + 부사」 사이에 대명사! turn it off",
    d: "turn off, put on처럼 <b>동사+부사</b> 덩어리는, 목적어가 <b>대명사(it, them...)</b>면 반드시 <b>동사와 부사 사이</b>에 넣어요. turn off it (✕)",
    e: "turn <em>it</em> off (○) / turn off <em>it</em> (✕)<br>단, 일반 명사면 둘 다 OK → turn off <em>the clock</em> = turn <em>the clock</em> off" },
  { t: "6. 지칭어 찾기 — it / they / these",
    d: "글에 나온 <b>it, they, these programs</b> 같은 말은 <b>바로 앞 문장</b>에서 가리키는 대상을 찾으면 됩니다. 단수(it)인지 복수(they)인지가 결정적 힌트!",
    e: "Viruses, worms, and spyware ... <em>These programs</em> can harm your computer. Also, <em>they</em> can steal ...<br>→ they = viruses, worms, and spyware (복수!)" },
  { t: "7. to부정사 '~하기 위해서' (목적)",
    d: "동사 뒤에 to+동사원형이 붙어 <b>목적</b>('~하기 위해서')을 나타내는 경우가 아주 흔해요. 'in order to'로 바꿔도 뜻이 통하면 목적입니다.",
    e: "You have to get up <em>to turn it off</em>.<br>→ 그것을 <b>끄기 위해서</b> 일어나야 한다." },
  { t: "8. 주제·목적·불일치 문제 푸는 법",
    d: "<b>주제·요지</b>는 반복되는 핵심어와 마지막 문장을 보고, <b>목적</b>은 글쓴이가 무엇을 하려는지(소개·광고 / 충고 / 사과 / 경고)를 보세요. <b>불일치</b> 문제는 보기 하나하나를 지문에서 <b>직접 찾아 대조</b>하는 게 안전합니다.",
    e: "however, also, for example 같은 <em>연결어</em>가 나오면 흐름이 바뀌거나 예시가 이어진다는 신호! 문제 풀 때 꼭 표시해 두기." }
];

/* ══════ 문제 20문항 ══════ */
var ALL_QUESTIONS = [
/* ─── 지문 A (1~7) ─── */
{ p:"A", q:"윗글의 주제로 가장 적절한 것은?",
  choices:["신발과 관련된 여러 가지 미신","신발을 오래 신는 관리 방법","여자친구에게 줄 선물 고르는 법","좋은 신발을 고르는 기준","신발 끈을 예쁘게 묶는 방법"],
  answer:"신발과 관련된 여러 가지 미신",
  exp:"첫 문장 <span class='key'>There are many superstitions about shoes.</span>가 곧 주제문이에요. 그 뒤로는 전부 '어떤 미신이 있는지'를 하나씩 나열하고 있죠. 이렇게 <b>첫 문장에 핵심어(superstitions)</b>가 나오고 뒤에서 예시가 이어지면, 그 첫 문장이 주제입니다." },

{ p:"A", q:"윗글에 따르면, <b>행운</b>을 가져오는 행동은?",
  choices:["다른 사람의 신발 끈을 묶어 주며 소원 빌기","신발을 탁자 위에 올려놓기","왼쪽 신발을 먼저 신기","여자친구에게 신발 선물하기","신발을 반대쪽 발에 신기"],
  answer:"다른 사람의 신발 끈을 묶어 주며 소원 빌기",
  exp:"마지막 문장 <span class='key'>However, if you want good luck, tie someone's shoelaces and make a wish.</span> — <b>However</b>가 나온 순간 '나쁜 것들 → 좋은 것'으로 흐름이 바뀐다는 신호예요(개념 카드 8). 나머지 보기는 전부 그 앞에 나온 <b>불운</b>한 행동들입니다." },

{ p:"A", q:"밑줄 친 <b>she will walk away from you!</b>가 뜻하는 바로 가장 적절한 것은?",
  choices:["여자친구가 떠나가 버린다(헤어진다)","여자친구가 함께 산책하자고 한다","여자친구가 신발을 신고 운동하러 간다","여자친구가 신발을 돌려준다","여자친구가 멀리 이사를 간다"],
  answer:"여자친구가 떠나가 버린다(헤어진다)",
  exp:"<span class='key'>walk away from ~</span>는 글자 그대로는 '~에게서 걸어 나가다'지만, 여기서는 <b>'떠나 버리다, 관계를 끝내다'</b>라는 뜻이에요. 신발(=걷는 물건)을 선물하면 그 신발을 신고 떠나간다는 미신이라서, 글 전체가 '불운'을 설명하는 흐름과도 딱 맞습니다." },

{ p:"A", q:"<b>It</b> is dangerous to put your shoes on the table. 에서 <b>It</b>이 실제로 가리키는 것은?",
  choices:["to put your shoes on the table","the table","your shoes","앞 문장 전체","날씨나 상황을 나타내는 말이라 뜻이 없다"],
  answer:"to put your shoes on the table",
  exp:"개념 카드 1번! 주어가 길어지는 걸 막으려고 자리만 채운 <b>가주어 it</b>이고, 진짜 주어는 뒤의 <span class='key'>to put your shoes on the table</span>이에요. 그래서 '<b>그것은</b> 위험하다'가 아니라 '<b>신발을 탁자 위에 올려놓는 것은</b> 위험하다'로 해석해야 자연스럽습니다." },

{ p:"A", q:"the wrong <b>feet</b>의 feet에 대한 설명으로 옳은 것은?",
  choices:["foot의 복수형이다","foot의 과거형이다","feets라고 써야 올바른 복수형이다","'손'을 뜻하는 단어이다","단수형이라서 '한쪽 발'을 뜻한다"],
  answer:"foot의 복수형이다",

    startTime = s.t || Date.now();
    $("concept-box").innerHTML = conceptHTML();
    $("concept-box2").innerHTML = conceptHTML();
    $("resume-card").classList.add("hidden");
    $("quiz-card").classList.remove("hidden");
    showQuestion();
    window.scrollTo(0, 0);
  });
  $("restart-btn").addEventListener("click", function(){
    clearProgress();
    $("resume-card").classList.add("hidden");
    $("start-card").classList.remove("hidden");
  });
})();


function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function conceptHTML(){
  return CONCEPTS.map(function(c){
    return '<div class="concept"><div class="ctitle">' + c.t + '</div><p>' + c.d + '</p><div class="ex">' + c.e + '</div></div>';
  }).join("");
}

/* 이름 게이트 */
var nameInput = $("name-input"), startBtn = $("start-btn");
nameInput.addEventListener("input", function(){
  startBtn.disabled = nameInput.value.trim().length === 0;
});
nameInput.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !startBtn.disabled) startBtn.click();
});

startBtn.addEventListener("click", function(){
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  shuffled = QUESTIONS.map(function(q){ return shuffle(q.choices); });
  $("concept-box").innerHTML = conceptHTML();
  $("concept-box2").innerHTML = conceptHTML();
  $("start-card").classList.add("hidden");
  $("concept-card").classList.remove("hidden");
  window.scrollTo(0, 0);
});

$("to-quiz-btn").addEventListener("click", function(){
  $("concept-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  showQuestion();
  window.scrollTo(0, 0);
});

function showQuestion(){
  var q = QUESTIONS[current];
  var pg = PASSAGES[q.p];
  $("progress").textContent = (current + 1) + " / " + QUESTIONS.length;
  $("ptitle").textContent = pg.tag.split(" · ")[0];
  $("bar-i").style.width = ((current) / QUESTIONS.length * 100) + "%";
  $("passage-box").innerHTML =
    '<div class="passage"><span class="ptag">' + pg.tag + '</span><p>' + pg.text +
    '<span class="gloss">' + pg.gloss + '</span></p></div>';
  $("qtext").innerHTML = "Q" + (current + 1) + ". " + q.q;
  var box = $("choices");
  box.innerHTML = "";
  shuffled[current].forEach(function(c, i){
    var b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="num">' + CIRCLED[i] + '</span>' + c;
    b.addEventListener("click", function(){ b.classList.add("picked"); pick(c, CIRCLED[i]); });
    box.appendChild(b);
  });
  var t = $("concept-toggle"); if (t) t.open = false;
}

function pick(choice, mark){
  if (locked) return; locked = true;
  var q = QUESTIONS[current];
  var ok = (choice === q.answer);
  if (ok) correctCount++; else wrongNumbers.push(current + 1);
  answersLog.push({ no: current + 1, ok: ok, chosen: mark + " " + choice, answer: q.answer });
  setTimeout(function(){
    locked = false;
    current++;
    if (current < QUESTIONS.length){ saveProgress(); showQuestion(); window.scrollTo(0, 0); }
    else showResult();
  }, 250);
}

document.addEventListener("keydown", function(e){
  if ($("quiz-card").classList.contains("hidden")) return;
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5){
    var btns = $("choices").querySelectorAll(".choice");
    if (btns[n - 1]) btns[n - 1].click();
  }
});

function cheerText(s){
  if (s >= 19) return "완벽에 가까워요! 이 정도 독해력이면 지문이 길어져도 끄떡없어요 👏";
  if (s >= 16) return "아주 잘했어요! 틀린 문항 해설만 확실히 정리하면 완성입니다 😊";
  if (s >= 12) return "잘하고 있어요! 개념 카드를 한 번 더 읽고 오답 해설을 꼼꼼히 보면 훨씬 단단해져요 💪";
  return "여기까지 온 것부터가 잘한 거예요! 해설을 천천히 읽으면서 개념 카드와 짝지어 보면 다음엔 확 올라갑니다 🌱";
}

function showResult(){
  clearProgress();
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + QUESTIONS.length;
  $("cheer").textContent = cheerText(correctCount);

  var expBox = $("explanations");
  QUESTIONS.forEach(function(q, i){
    var log = answersLog[i];
    var d = document.createElement("div");
    d.className = "exp" + (log && log.ok ? "" : " wrong");
    var head = log && log.ok
      ? "Q" + (i + 1) + ". 정답! ⭕"
      : "Q" + (i + 1) + ". 다시 보기 (내가 고른 답: " + (log ? log.chosen : "-") + " / 정답: " + q.answer + ")";
    d.innerHTML = "<b>" + head + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });

  if (META.next) {
    var nl = $("next-link");
    nl.href = META.next;
    nl.textContent = META.nextLabel;
    nl.classList.remove("hidden");
  }

  window.scrollTo(0, 0);

  engfitSubmitQuiet({
    quizId: QUIZ_ID,
    quizTitle: QUIZ_TITLE,
    student: studentName,
    score: correctCount,
    total: QUESTIONS.length,
    wrong: wrongNumbers,
    durationSec: Math.round((Date.now() - startTime) / 1000),
    detail: answersLog
  });
}

$("kakao-btn").addEventListener("click", function(){
  var mins = Math.round((Date.now() - startTime) / 60000);
  var msg = "[영핏 기본 실력 확인 · " + META.label + "]\n"
          + "학생: " + studentName + "\n"
          + "점수: " + correctCount + " / " + QUESTIONS.length + "\n"
          + "틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") + "번" : "없음") + "\n"
          + "걸린 시간: 약 " + mins + "분";
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(function(){
      $("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣어 보내주세요 ✓";
    }).catch(function(){ window.prompt("아래 내용을 길게 눌러 복사하세요", msg); });
  } else {
    window.prompt("아래 내용을 길게 눌러 복사하세요", msg);
  }
});
</script>
